<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>ChatFi Play</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink:#0b0b0b; --mute:#6f6f6a; --line:#e3e3df; --card:#fff; }
    html, body { margin:0; height:100%; color:var(--ink);
      font-family:'Space Grotesk','Inter',sans-serif; overflow:hidden; touch-action:manipulation;
      background:linear-gradient(180deg,#fff 0%,#f4f4f2 50%,#e5e5e1 100%) fixed; }
    #app { height:100%; }
    .scroll { height:100%; overflow-y:auto; padding:0 18px 28px; -webkit-overflow-scrolling:touch; }

    .top { display:flex; justify-content:space-between; align-items:center; padding:18px 0 14px; }
    .brand { display:flex; align-items:center; gap:8px; font-size:21px; font-weight:700; letter-spacing:-.02em; }
    .brand b { font-weight:500; color:var(--mute); }
    .mark { width:20px; height:20px; border-radius:7px; background:var(--ink); position:relative; }
    .mark::after { content:''; position:absolute; inset:6px; border-radius:50%; background:#fff; }
    .pill { font:inherit; font-size:13px; font-weight:600; border:0; border-radius:999px; padding:10px 16px; cursor:pointer; }
    .pill.dark { background:var(--ink); color:#fff; }
    .pill.light { background:#fff; color:var(--ink); font-size:15px; padding:13px 20px; display:inline-flex; gap:8px; }

    .hero { position:relative; overflow:hidden; color:#fff; border-radius:24px; padding:22px 20px; margin-top:4px;
      background-color:var(--ink);
      background-image:radial-gradient(rgba(255,255,255,.13) 1px, transparent 1.5px), linear-gradient(160deg,#1f1f1f 0%,#050505 70%);
      background-size:16px 16px, 100% 100%; }
    .eyebrow { display:inline-flex; align-items:center; gap:8px; font-size:12px; background:rgba(255,255,255,.1);
      padding:6px 11px; border-radius:999px; }
    .live { width:7px; height:7px; border-radius:50%; background:#fff; animation:pulse 1.6s infinite; }
    @keyframes pulse { 50% { opacity:.25; } }
    .hero h1 { font-size:34px; line-height:1.05; letter-spacing:-.03em; margin:16px 0 10px; }
    .hero p { margin:0 0 18px; color:#b9b9b4; font-size:14px; line-height:1.45; max-width:30ch; }

    .sec { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--mute); margin:26px 2px 12px; font-weight:600; }
    .games { display:grid; gap:12px; }
    .card { all:unset; box-sizing:border-box; display:flex; align-items:center; gap:14px; background:var(--card);
      border:1px solid var(--line); border-radius:20px; padding:12px; cursor:pointer;
      box-shadow:0 6px 18px rgba(0,0,0,.06); transition:transform .12s; }
    .card:active { transform:scale(.98); }
    .art { flex:none; width:76px; height:76px; border-radius:16px; background:linear-gradient(145deg,#222,#050505);
      display:grid; place-items:center; }
    .art svg { width:46px; height:46px; }
    .initial { color:#fff; font-size:28px; font-weight:700; }
    .info { flex:1; min-width:0; }
    .info h2 { margin:0; font-size:17px; letter-spacing:-.01em; }
    .info p { margin:2px 0 9px; color:var(--mute); font-size:13px; }
    .meta { display:flex; align-items:center; gap:10px; font-size:12px; flex-wrap:wrap; }
    .badge { background:#f0f0ed; border-radius:999px; padding:3px 9px; font-weight:600; }
    .on { display:inline-flex; align-items:center; gap:5px; color:var(--mute); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--ink); }
    .go { flex:none; width:34px; height:34px; border-radius:50%; background:var(--ink); color:#fff;
      display:grid; place-items:center; font-size:16px; }

    .chips { display:flex; gap:8px; flex-wrap:wrap; }
    .chips span { border:1px dashed #bdbdb8; border-radius:999px; padding:8px 14px; font-size:13px; color:var(--mute); }
    .dev { margin-top:22px; border:1px solid var(--line); background:rgba(255,255,255,.7); border-radius:20px; padding:16px; }
    .dev h4 { margin:0 0 4px; font-size:15px; }
    .dev p { margin:0; color:var(--mute); font-size:13px; line-height:1.45; }
    .foot { text-align:center; color:#a0a09b; font-size:11px; padding:18px 0 0; }

    .hero, .card, .dev { animation:rise .5s both; }
    .games .card:nth-child(2) { animation-delay:.08s; }
    .games .card:nth-child(3) { animation-delay:.16s; }
    @keyframes rise { from { opacity:0; transform:translateY(10px); } }

    .stage { position:relative; height:100%; }
    #host { position:absolute; inset:0; background:linear-gradient(180deg,#fff 0%,#f1f1ee 60%,#e2e2de 100%); }
    .back { position:absolute; top:12px; left:12px; z-index:10; background:#fff; color:var(--ink);
      border:1px solid var(--line); border-radius:999px; padding:9px 15px; font:inherit; font-size:14px;
      font-weight:600; box-shadow:0 4px 12px rgba(0,0,0,.08); }
    .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:#fff;
      padding:11px 18px; border-radius:999px; font-size:13px; z-index:99; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
